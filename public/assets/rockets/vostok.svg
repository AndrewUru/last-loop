<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 362">
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#76827a"/>
      <stop offset="0.3" stop-color="#e4ebe2"/>
      <stop offset="0.6" stop-color="#c6cfc4"/>
      <stop offset="1" stop-color="#68746b"/>
    </linearGradient>
    <linearGradient id="white" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#97a0a6"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#dfe4e7"/>
      <stop offset="1" stop-color="#8a939a"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1d2124"/>
      <stop offset="0.35" stop-color="#5a636b"/>
      <stop offset="0.7" stop-color="#2f353a"/>
      <stop offset="1" stop-color="#15181b"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22272b"/>
      <stop offset="0.4" stop-color="#8a939b"/>
      <stop offset="0.7" stop-color="#3a4046"/>
      <stop offset="1" stop-color="#1a1d20"/>
    </linearGradient>
  </defs>
  <g stroke="#1b2430" stroke-width="1" stroke-linejoin="round">
    <!-- Side boosters, behind the core -->
    <path d="M47,156 C44,190 34,262 25,338 L25,346 L54,346 L54,160 Z" fill="url(#body)"/>
    <path d="M73,156 C76,190 86,262 95,338 L95,346 L66,346 L66,160 Z" fill="url(#body)"/>
    <path d="M47,156 C46.2,166 45.2,176 44,188 L54,188 L54,160 Z" fill="url(#dark)"/>
    <path d="M73,156 C73.8,166 74.8,176 76,188 L66,188 L66,160 Z" fill="url(#dark)"/>
    <path d="M27,316 L14,346 L27,346 Z" fill="url(#dark)"/>
    <path d="M93,316 L106,346 L93,346 Z" fill="url(#dark)"/>
    <path d="M27,346 L36,346 L38,358 L25,358 Z" fill="url(#nozzle)"/>
    <path d="M37,346 L46,346 L48,358 L35,358 Z" fill="url(#nozzle)"/>
    <path d="M93,346 L84,346 L82,358 L95,358 Z" fill="url(#nozzle)"/>
    <path d="M83,346 L74,346 L72,358 L85,358 Z" fill="url(#nozzle)"/>
    <!-- Core stage -->
    <path d="M49,128 L71,128 L71,236 L68,346 L52,346 L49,236 Z" fill="url(#body)"/>
    <!-- Truss between the core and the upper stage -->
    <rect x="51" y="118" width="18" height="10" fill="#3a4046"/>
    <path d="M51,118 L60,128 L69,118 M51,128 L60,118 L69,128" fill="none" stroke="#9aa4ad" stroke-width="0.8"/>
    <!-- Upper stage -->
    <rect x="51" y="86" width="18" height="32" fill="url(#body)"/>
    <rect x="51" y="108" width="18" height="3" fill="url(#dark)" stroke="none"/>
    <path d="M49,78 L71,78 L69,86 L51,86 Z" fill="url(#dark)"/>
    <!-- Payload shroud -->
    <path d="M60,6 C64,14 70,28 71,42 L71,78 L49,78 L49,42 C50,28 56,14 60,6 Z" fill="url(#white)"/>
    <path d="M49,48 L71,48" fill="none" stroke="#9aa4ad" stroke-width="0.8"/>
    <!-- Front booster -->
    <path d="M60,170 C63,200 70,280 73,338 L73,346 L47,346 L47,338 C50,280 57,200 60,170 Z" fill="url(#body)"/>
    <path d="M60,170 C61.3,182 62.4,192 63.2,202 L56.8,202 C57.6,192 58.7,182 60,170 Z" fill="url(#dark)"/>
    <path d="M49,346 L59,346 L61,360 L47,360 Z" fill="url(#nozzle)"/>
    <path d="M61,346 L71,346 L73,360 L59,360 Z" fill="url(#nozzle)"/>
  </g>
</svg>
