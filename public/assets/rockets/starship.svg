    <rect x="25" y="0" width="12" height="172" fill="url(#tiles)" stroke="none" clip-path="url(#ship)"/>
    <path d="M37,100 L55,100 M37,140 L55,140" fill="none" stroke="#8b949c" stroke-width="0.5"/>
    <path d="M40,6 C50,8 55,28 55,50 L55,172 L25,172 L25,50 C25,28 30,8 40,6 Z" fill="none"/>
