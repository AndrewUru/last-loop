    <path d="M25,240 L55,240 M25,296 L55,296 M25,352 L55,352" fill="none" stroke="#8b949c" stroke-width="0.5"/>
    <rect x="25" y="408" width="30" height="12" fill="url(#dark)"/>
    <rect x="14" y="192" width="11" height="16" fill="#555d65"/>
    <rect x="55" y="192" width="11" height="16" fill="#555d65"/>
    <path d="M14,197.3 L25,197.3 M14,202.6 L25,202.6 M17.7,192 L17.7,208 M21.3,192 L21.3,208 M55,197.3 L66,197.3 M55,202.6 L66,202.6 M58.7,192 L58.7,208 M62.3,192 L62.3,208" fill="none" stroke="#2b3036" stroke-width="0.5"/>
    <!-- Hot-staging ring -->
    <rect x="25" y="172" width="30" height="12" fill="url(#dark)"/>
    <path d="M29,174.5 L29,181.5 M33.5,174.5 L33.5,181.5 M38,174.5 L38,181.5 M42.5,174.5 L42.5,181.5 M47,174.5 L47,181.5 M51.5,174.5 L51.5,181.5" fill="none" stroke="#c7cdd2" stroke-width="1"/>
    <!-- Ship flaps -->
    <path d="M25,128 L11,146 L11,168 L25,172 Z" fill="url(#tiles)"/>
    <path d="M55,128 L69,146 L69,168 L55,172 Z" fill="url(#tiles)"/>
