<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 434">
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6a737b"/>
      <stop offset="0.28" stop-color="#e9edf0"/>
      <stop offset="0.5" stop-color="#b3bbc2"/>
      <stop offset="0.72" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#666e76"/>
    </linearGradient>
    <linearGradient id="tiles" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0c0e11"/>
      <stop offset="0.5" stop-color="#2b3036"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1d2124"/>
      <stop offset="0.35" stop-color="#4a525a"/>
      <stop offset="1" stop-color="#16191c"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" x2="1" y1="0" y2="0">
