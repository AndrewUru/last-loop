<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 322">
  <defs>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7f4114"/>
      <stop offset="0.35" stop-color="#e58f40"/>
      <stop offset="0.65" stop-color="#c96f28"/>
      <stop offset="1" stop-color="#733a11"/>
    </linearGradient>
    <linearGradient id="white" x1="0" x2="1" y1="0" y2="0">
