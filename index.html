<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Last Loop</title>
  <meta name="description" content="Arcade de cohetes: elige uno de diez cohetes legendarios y pilótalo hasta la órbita." />
  <meta name="theme-color" content="#08111b" />
  <meta property="og:title" content="Last Loop" />
  <meta property="og:description" content="Pilota cohetes legendarios y ponlos en órbita." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308111b'/%3E%3Ccircle cx='32' cy='34' r='19' fill='none' stroke='%2373f7c0' stroke-width='3' stroke-dasharray='84 36' transform='rotate(-50 32 34)'/%3E%3Cpath d='M32 12c7 6 9 15 9 23H23c0-8 2-17 9-23z' fill='%23f3f7fb'/%3E%3Cpath d='M23 35l-6 8h9zM41 35l6 8h-9z' fill='%23ffb26b'/%3E%3Cpath d='M28 37h8l-4 12z' fill='%23ffd166'/%3E%3Ccircle cx='32' cy='25' r='3.5' fill='%2368d9ff'/%3E%3C/svg%3E" />
  <style>
    @property --grid-gap {
      syntax: "<length>";
      initial-value: 12px;
      inherits: true;
    }

    :root {
      color-scheme: light;
      --bg: hsl(220 16% 94%);
      --bg2: hsl(212 50% 92%);
      --fg: hsl(212 22% 26%);
      --grid-hue: 220;
      --grid-gap: 12px;
      --grid-opacity: 0.35;
      --grid-border: clamp(8px, 1.2vw, 14px);
      --grid-bg: hsl(var(--grid-hue) 50% 92%);
      --grid-minor: hsl(var(--grid-hue) 60% 20% / calc(var(--grid-opacity) * 0.125));
      --grid-major: hsl(var(--grid-hue) 60% 20% / calc(var(--grid-opacity) * 0.35));
      --grid-cross: hsl(var(--grid-hue) 60% 20% / var(--grid-opacity));
      --paper-lines-y: linear-gradient(var(--grid-minor) 0 1px, transparent 1px var(--grid-gap));
      --paper-lines-x: linear-gradient(to right, var(--grid-minor) 0 1px, transparent 1px var(--grid-gap));
      --paper-lines-y-major: linear-gradient(var(--grid-major) 0 1px, transparent 1px calc(var(--grid-gap) * 5));
      --paper-lines-x-major: linear-gradient(to right, var(--grid-major) 0 1px, transparent 1px calc(var(--grid-gap) * 5));
      --paper-cross-y: linear-gradient(var(--grid-cross) 0 1px, transparent 1px calc(var(--grid-gap) * 5));
      --paper-cross-x: linear-gradient(to right, var(--grid-cross) 0 1px, transparent 1px calc(var(--grid-gap) * 5));
      --paper-cross-mask: radial-gradient(
        circle at center,
        transparent calc(var(--grid-gap) / 2),
        var(--grid-bg) calc(var(--grid-gap) / 2) 100%
      );
      --paper-gradient:
        var(--paper-lines-y),
        var(--paper-lines-x),
        var(--paper-lines-y-major),
        var(--paper-lines-x-major),
        var(--paper-cross-mask),
        var(--paper-cross-y),
        var(--paper-cross-x);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      height: 100svh;
      min-height: 100svh;
      height: 100dvh;
      min-height: 100dvh;
      color: var(--fg);
      font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--grid-bg);
      background-image: var(--paper-gradient);
      background-size:
        var(--grid-gap) var(--grid-gap),
        var(--grid-gap) var(--grid-gap),
        calc(var(--grid-gap) * 5) calc(var(--grid-gap) * 5),
        calc(var(--grid-gap) * 5) calc(var(--grid-gap) * 5),
        calc(var(--grid-gap) * 5) calc(var(--grid-gap) * 5),
        calc(var(--grid-gap) * 5) calc(var(--grid-gap) * 5),
        calc(var(--grid-gap) * 5) calc(var(--grid-gap) * 5);
      background-repeat: repeat;
      background-position:
        var(--grid-border) var(--grid-border),
        var(--grid-border) var(--grid-border),
        var(--grid-border) var(--grid-border),
        var(--grid-border) var(--grid-border),
        calc(var(--grid-border) - var(--grid-gap) * 2.5) calc(var(--grid-border) - var(--grid-gap) * 2.5),
        var(--grid-border) var(--grid-border),
        var(--grid-border) var(--grid-border);
      box-shadow:
        inset 0 0 0 var(--grid-border) var(--grid-bg),
        inset 0 0 0 calc(var(--grid-border) + 1px) var(--grid-cross),
        inset 0 0 0 calc(var(--grid-border) + 2px) var(--bg2);
      padding:
        max(var(--grid-border), env(safe-area-inset-top))
        max(var(--grid-border), env(safe-area-inset-right))
        max(var(--grid-border), env(safe-area-inset-bottom))
        max(var(--grid-border), env(safe-area-inset-left));
      overflow: hidden;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      border: 1px solid hsl(213 35% 70% / 0.7);
      border-radius: 22px;
      box-shadow:
        0 28px 60px hsl(218 35% 36% / 0.16),
        inset 0 1px 0 hsl(0 0% 100% / 0.5);
      background:
        linear-gradient(180deg, hsl(0 0% 100% / 0.5), hsl(210 48% 96% / 0.88));
      backdrop-filter: blur(8px);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Shown while the artwork loads; BootScene fills the bar and removes it. */
    #boot-loader {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #08111b;
      color: #f3f7fb;
      font-weight: 700;
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 0.08em;
    }

    #boot-loader .track {
      width: min(260px, 60%);
      height: 6px;
      border-radius: 3px;
      background: #1d2f42;
      overflow: hidden;
    }

    #boot-progress {
      width: 100%;
      height: 100%;
      background: #73f7c0;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 120ms linear;
    }

    #boot-loader small {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #93a9bf;
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 18%;
      z-index: 3;
      transform: translate(-50%, 8px);
      padding: 9px 16px;
      border-radius: 10px;
      background: hsl(212 40% 8% / 0.88);
      color: #f3f7fb;
      font-size: 15px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px), (pointer: coarse) and (max-height: 760px) {
      :root {
        --grid-border: 0px;
        --grid-gap: 10px;
      }

      body {
        box-shadow: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #game-container {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
      }
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="boot-loader" role="status" aria-live="polite">
      LAST LOOP
      <div class="track"><div id="boot-progress"></div></div>
      <small>Cargando el hangar…</small>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript>Last Loop necesita JavaScript para funcionar.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
